
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Gestor de Tareas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Gestor de Tareas</h1>
        <button onclick="mostrarFormulario()">Agregar Tarea</button>
    </header>

    <main>
        <section id="formulario" style="display: none;">
            <input type="text" id="titulo" placeholder="Título de la tarea" />
            <input type="text" id="descripcion" placeholder="Descripción" />
            <button onclick="crearTarea()">Guardar</button>
        </section>

        <section id="lista-tareas">
            <!-- Aquí se cargarán las tareas -->
        </section>
    </main>

    <footer>
        <p>© 2025 Gestor de Tareas API</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
