<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Gestor de Tareas</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Añadir CDN de iconos (Heroicons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-bar">
            <h1>
                <span class="header-icon"><i class="fa-solid fa-list-check"></i></span>
                Gestor de Tareas
                <span class="header-label">API</span>
            </h1>
            <button class="btn-agregar-tarea" onclick="mostrarFormulario()">
                <i class="fa-solid fa-plus"></i> Agregar Tarea
            </button>
        </div>
    </header>

    <main>
        <section id="formulario" class="formulario-tarea" style="display: none;">
            <div class="formulario-header">
                <span>Agregar Nueva Tarea</span>
                <button class="btn-cerrar-form" onclick="cerrarFormulario()" title="Cerrar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <input type="text" id="titulo" placeholder="Título de la tarea (ej: Comprar pan)" maxlength="50" required />
            <input type="text" id="descripcion" placeholder="Descripción breve (ej: Ir a la panadería antes de las 10am)" maxlength="120" required />
            <select id="prioridad" required>
                <option value="baja">Prioridad Baja</option>
                <option value="media" selected>Prioridad Media</option>
                <option value="alta">Prioridad Alta</option>
            </select>
            <input type="date" id="fechaVencimiento" placeholder="Fecha de vencimiento" />
            <button class="btn-guardar-tarea" onclick="crearTarea()">
                <i class="fa-solid fa-floppy-disk"></i> Guardar
            </button>
        </section>

        <div class="tablero-tareas">
            <section class="columna-tareas todo">
                <h2>To Do</h2>
                <div id="lista-tareas-todo" class="lista-tareas-columna">
                    <!-- Tareas To Do -->
                </div>
            </section>
            <section class="columna-tareas in-progress">
                <h2>In Progress</h2>
                <div id="lista-tareas-inprogress" class="lista-tareas-columna">
                    <!-- Tareas In Progress -->
                </div>
            </section>
            <section class="columna-tareas review">
                <h2>Review</h2>
                <div id="lista-tareas-review" class="lista-tareas-columna">
                    <!-- Tareas Review -->
                </div>
            </section>
            <section class="columna-tareas done">
                <h2>Done</h2>
                <div id="lista-tareas-done" class="lista-tareas-columna">
                    <!-- Tareas Done -->
                </div>
            </section>
        </div>
    </main>

    <!-- Modal de Edición -->
    <div id="modalEditar" class="modal" style="display: none;">
        <div class="modal-contenido">
            <div class="modal-header">
                <h2>Editar Tarea</h2>
                <button class="btn-cerrar-modal" onclick="cerrarModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="campo-formulario">
                    <label for="editTitulo">Título</label>
                    <input type="text" id="editTitulo" maxlength="50" required>
                </div>
                <div class="campo-formulario">
                    <label for="editDescripcion">Descripción</label>
                    <textarea id="editDescripcion" maxlength="120" required></textarea>
                </div>
                <div class="campo-formulario">
                    <label for="editPrioridad">Prioridad</label>
                    <select id="editPrioridad">
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>
                <div class="campo-formulario">
                    <label for="editFechaVencimiento">Fecha de Vencimiento</label>
                    <input type="date" id="editFechaVencimiento">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-guardar" onclick="guardarEdicion()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2025 Gestor de Tareas API</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
